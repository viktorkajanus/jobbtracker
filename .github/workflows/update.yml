name: Update jobs

on:
  schedule:
    - cron: "15 4 * * *"   # nightly, about 05:15/06:15 Swedish time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          pip install pytest
          python -m pytest -q

      # Pushes (e.g. jobs imported from LinkedIn) only re-merge, so the page updates in a minute.
      - name: Fetch jobs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m jobbtracker.run --no-fetch
          else
            python -m jobbtracker.run
          fi

      - name: Commit data
        run: |
          git config user.name "jobbtracker-bot"
          git config user.email "jobbtracker-bot@users.noreply.github.com"
          git add site/data/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
